[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-fraud-graphs"
version = "0.1.0"
description = "Graph-Based Synthetic Fraud Ring Generator for Travel Networks — a benchmark dataset for GNN fraud detection research"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "TFG Contributors" },
]
keywords = [
    "fraud detection",
    "graph neural networks",
    "synthetic dataset",
    "benchmark",
    "travel",
    "heterogeneous graph",
    "GNN",
    "anomaly detection",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
networkx = ["networkx>=2.6"]
pyg = ["torch>=1.13", "torch_geometric>=2.2"]
dgl = ["torch>=1.13", "dgl>=1.1"]
all = [
    "networkx>=2.6",
    "torch>=1.13",
    "torch_geometric>=2.2",
]

[project.scripts]
tfg = "travel_fraud_graphs.cli:main"

[project.urls]
"Homepage"    = "https://github.com/YOUR-ORG/travel-fraud-graphs"
"Bug Tracker" = "https://github.com/YOUR-ORG/travel-fraud-graphs/issues"
"Paper"       = "https://arxiv.org/abs/XXXX.XXXXX"
"Dataset"     = "https://huggingface.co/datasets/YOUR-ORG/travel-fraud-graphs"

[tool.setuptools.packages.find]
where = ["src"]
